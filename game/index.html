<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall — The Last Lantern</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070614; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status, #netcheck { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Emberfall: move the lantern with WASD, aim with the mouse, hold click to shoot embers at the shadow wisps"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<p id="netcheck" aria-hidden="true"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
